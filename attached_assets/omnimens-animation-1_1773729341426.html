<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OMNIMENS Avatar</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: rgba(0, 0, 0, 0);
    }
    canvas {
      display: block;
    }
    #rec-button {
      position: absolute;
      top: 10px;
      right: 10px;
      padding: 10px;
      background: #8b0000;
      color: white;
      font-family: monospace;
      font-size: 14px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    #rec-button.recording {
      background: #ff0000;
    }
  </style>
</head>
<body>
  <button id="rec-button">⬤ REC</button>
  <canvas id="omnimensCanvas"></canvas>

<script>
// Canvas setup
const canvas = document.getElementById("omnimensCanvas");
const ctx = canvas.getContext("2d");
canvas.width = 400;
canvas.height = 600;

// Recording setup
const recButton = document.getElementById("rec-button");
let mediaRecorder;
let recordedChunks = [];
let recording = false;

recButton.addEventListener("click", () => {
  if (!recording) {
    startRecording();
  } else {
    stopRecording();
  }
});

function startRecording() {
  recordedChunks = [];
  const stream = canvas.captureStream(30); // 30 FPS
  mediaRecorder = new MediaRecorder(stream);
  mediaRecorder.ondataavailable = (event) => {
    if (event.data.size > 0) {
      recordedChunks.push(event.data);
    }
  };
  mediaRecorder.onstop = () => {
    const blob = new Blob(recordedChunks, { type: "video/webm" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "omnimens-avatar.webm";
    a.click();
  };
  mediaRecorder.start();
  recButton.textContent = "⬤ STOP";
  recButton.classList.add("recording");
  recording = true;
}

function stopRecording() {
  mediaRecorder.stop();
  recButton.textContent = "⬤ REC";
  recButton.classList.remove("recording");
  recording = false;
}

// Avatar variables
const avatar = {
  breathing: 0,
  weightShift: 0,
  headTilt: 0,
  eyeBlink: 0,
  eyeGlow: 1,
  fingers: Array(10).fill(0).map(() => Math.random() * Math.PI * 2),
  spineTilt: 0,
  jawMove: 0,
  idle: true,
  particles: [],
};

// Create particles
for (let i = 0; i < 50; i++) {
  avatar.particles.push({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    vx: Math.random() * 0.5 - 0.25,
    vy: Math.random() * 0.5 - 0.25,
    size: Math.random() * 3 + 1,
    glow: Math.random() * 0.5 + 0.5,
  });
}

function drawParticles() {
  for (const particle of avatar.particles) {
    particle.x += particle.vx;
    particle.y += particle.vy;

    if (particle.x < 0 || particle.x > canvas.width) particle.vx = -particle.vx;
    if (particle.y < 0 || particle.y > canvas.height) particle.vy = -particle.vy;

    ctx.beginPath();
    ctx.arc(particle.x, particle.y, particle.size, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(0, 255, 255, ${particle.glow})`;
    ctx.fill();
    ctx.closePath();
  }
}

// Utility functions for drawing
function drawJoint(x, y, radius, glow = false) {
  ctx.beginPath();
  ctx.arc(x, y, radius, 0, Math.PI * 2);
  ctx.fillStyle = glow ? "rgba(0, 255, 255, 0.8)" : "rgba(0, 255, 255, 0.5)";
  ctx.fill();
  ctx.closePath();
}

function drawLimb(x1, y1, x2, y2, width, glow = false) {
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.lineWidth = width;
  ctx.strokeStyle = glow ? "rgba(0, 255, 255, 0.8)" : "rgba(0, 255, 255, 0.5)";
  ctx.stroke();
  ctx.closePath();
}

function drawAvatar(deltaTime) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Update breathing and weight shift cycles
  avatar.breathing += deltaTime * 0.002;
  avatar.weightShift += deltaTime * 0.001;

  // Particles
  drawParticles();

  // Torso and breathing effect
  const chestRise = Math.sin(avatar.breathing) * 5;
  const torsoX = canvas.width / 2 + Math.sin(avatar.weightShift) * 10;
  const torsoY = canvas.height * 0.6 + chestRise;

  // Draw torso
  ctx.beginPath();
  ctx.ellipse(torsoX, torsoY, 30, 60, 0, 0, Math.PI * 2);
  ctx.fillStyle = "rgba(0, 255, 255, 0.6)";
  ctx.fill();
  ctx.closePath();

  // Spine sway
  avatar.spineTilt = Math.sin(avatar.weightShift) * 10;

  // Head
  const headX = torsoX + avatar.spineTilt * 0.5;
  const headY = torsoY - 80;
  drawJoint(headX, headY, 20, true);

  // Arms and legs will follow similar patterns (not shown here for brevity)
}

// Animation loop
let lastTime = 0;

function animate(time) {
  const deltaTime = time - lastTime;
  lastTime = time;

  drawAvatar(deltaTime);

  requestAnimationFrame(animate);
}

animate(0);
</script>
</body>
</html>
