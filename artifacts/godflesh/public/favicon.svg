<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="OMNIMENS">
  <defs>
    <radialGradient id="bg-fill" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#1a0a2e" />
      <stop offset="100%" stop-color="#0a0010" />
    </radialGradient>

    <radialGradient id="gf-orb" cx="38%" cy="35%" r="65%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="1" />
      <stop offset="35%"  stop-color="#e0d0ff" stop-opacity="0.95" />
      <stop offset="70%"  stop-color="#9b6fff" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#4a1fa8" stop-opacity="0.7" />
    </radialGradient>

    <radialGradient id="gf-glow-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#b085ff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#4a1fa8" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="gf-ring-a" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#c4a8ff" stop-opacity="0" />
      <stop offset="30%"  stop-color="#e0d0ff" stop-opacity="0.9" />
      <stop offset="70%"  stop-color="#c4a8ff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#c4a8ff" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="gf-ring-b" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#a0d4ff" stop-opacity="0" />
      <stop offset="40%"  stop-color="#c8e8ff" stop-opacity="0.85" />
      <stop offset="60%"  stop-color="#c8e8ff" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#a0d4ff" stop-opacity="0" />
    </linearGradient>

    <filter id="gf-orb-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="gf-soft-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark background with rounded corners -->
  <rect width="64" height="64" rx="14" fill="url(#bg-fill)" />

  <!-- Background corona -->
  <circle cx="32" cy="32" r="28" fill="url(#gf-glow-bg)" />

  <!-- Orbital ring A — horizontal tilt (ellipse, wide) -->
  <ellipse cx="32" cy="32" rx="22" ry="7" fill="none" stroke="url(#gf-ring-a)" stroke-width="1.2" filter="url(#gf-soft-glow)" />

  <!-- Orbital ring B — vertical tilt (ellipse, tall) -->
  <ellipse cx="32" cy="32" rx="8" ry="22" fill="none" stroke="url(#gf-ring-b)" stroke-width="1.0" filter="url(#gf-soft-glow)" />

  <!-- Particle nodes at ring intersections -->
  <circle cx="54" cy="32" r="1.4" fill="#e0d8ff" fill-opacity="0.9" />
  <circle cx="10" cy="32" r="1.4" fill="#e0d8ff" fill-opacity="0.9" />
  <circle cx="32" cy="10" r="1.2" fill="#c8e8ff" fill-opacity="0.85" />
  <circle cx="32" cy="54" r="1.2" fill="#c8e8ff" fill-opacity="0.85" />

  <!-- Central orb -->
  <circle cx="32" cy="32" r="11" fill="url(#gf-orb)" filter="url(#gf-orb-glow)" />

  <!-- Specular highlight -->
  <ellipse cx="27.5" cy="27" rx="3.5" ry="2.2" fill="white" fill-opacity="0.55" transform="rotate(-20, 27.5, 27)" />

  <!-- Tiny bright center point -->
  <circle cx="32" cy="32" r="2.5" fill="white" fill-opacity="0.9" />
</svg>
