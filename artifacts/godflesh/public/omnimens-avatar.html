<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OMNIMENS Avatar</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: rgba(0,0,0,0); }
    canvas { display: block; }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
canvas.width  = 400;
canvas.height = 600;

// ── PostMessage API ───────────────────────────────────────────────────────────
let speaking = false;
window.addEventListener("message", e => {
  if (e.data?.type === "speak") speaking = true;
  if (e.data?.type === "idle")  speaking = false;
});

// ── Timing ────────────────────────────────────────────────────────────────────
const t = { breath:0, weight:0, head:0, blink:0, jaw:0, finger:0, toe:0, ear:0, iris:0, glow:0 };
let lastBlinkTime = 0, nextBlinkIn = 3000 + Math.random()*3000, blinkPhase = 0, blinkVal = 0;

// ── Particles ─────────────────────────────────────────────────────────────────
const particles = Array.from({ length: 55 }, () => ({
  x: Math.random() * 400, y: Math.random() * 600,
  vx: (Math.random() - 0.5) * 0.4, vy: (Math.random() - 0.5) * 0.4,
  r: Math.random() * 2.2 + 0.6, life: Math.random(),
  hue: Math.random() < 0.5 ? 185 : 270,
}));

// ── Colour helpers ────────────────────────────────────────────────────────────
const CYAN   = (a=1) => `rgba(0,225,215,${a})`;
const SKIN   = (a=1) => `rgba(8,18,32,${a})`;

// ── Draw helpers ──────────────────────────────────────────────────────────────
function line(x1,y1,x2,y2,w,col){
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2);
  ctx.lineWidth=w; ctx.strokeStyle=col; ctx.lineCap="round"; ctx.stroke();
}
function circle(x,y,r,fill,stroke,sw=1){
  ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2);
  if(fill){ctx.fillStyle=fill;ctx.fill();}
  if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=sw;ctx.stroke();}
}
function glow(x,y,r,col,blur=18){
  ctx.save(); ctx.shadowColor=col; ctx.shadowBlur=blur;
  circle(x,y,r,col); ctx.restore();
}

// ── Finger / Toe drawers ──────────────────────────────────────────────────────
function drawFinger(ox,oy, a1, curl, flip=1){
  const len = [13,10,7];
  let px=ox, py=oy, ang=a1;
  for(let seg=0;seg<3;seg++){
    ang += curl * 0.5 * flip * (seg===0?0.7:1);
    const nx=px+Math.cos(ang)*len[seg], ny=py+Math.sin(ang)*len[seg];
    line(px,py,nx,ny, 2.5-seg*0.5, CYAN(0.5-seg*0.07));
    circle(nx,ny, 1.8-seg*0.3, CYAN(0.4-seg*0.08));
    px=nx; py=ny;
  }
}
function drawToe(ox,oy, angle, curl){
  const nx=ox+Math.cos(angle)*9, ny=oy+Math.sin(angle)*9;
  const a2=angle+curl*0.45;
  const nx2=nx+Math.cos(a2)*6, ny2=ny+Math.sin(a2)*6;
  line(ox,oy,nx,ny,2,CYAN(0.4));
  line(nx,ny,nx2,ny2,1.5,CYAN(0.3));
  circle(nx,ny,1.8,CYAN(0.3));
}

// ── Main render ───────────────────────────────────────────────────────────────
function draw(dt){
  ctx.clearRect(0,0,400,600);

  t.breath  += dt * 0.0018;
  t.weight  += dt * 0.0008;
  t.head    += dt * 0.0012;
  t.blink   += dt;
  t.jaw     += dt * (speaking ? 0.013 : 0.002);
  t.finger  += dt * 0.0025;
  t.toe     += dt * 0.002;
  t.ear     += dt * 0.003;
  t.iris    += dt * 0.0007;
  t.glow    += dt * 0.004;

  const breath    = Math.sin(t.breath) * 6;
  const weightX   = Math.sin(t.weight) * 9;
  const spineLean = Math.sin(t.weight) * 5;
  const headNod   = Math.sin(t.head * 0.7) * 3;
  const headSway  = Math.sin(t.head) * 5;
  const jawOpen   = speaking
    ? Math.abs(Math.sin(t.jaw)) * 10
    : Math.abs(Math.sin(t.jaw * 0.3)) * 2;
  const fingerCurl = Math.sin(t.finger) * 0.5 + 0.45;
  const toeCurl    = Math.sin(t.toe) * 0.3 + 0.28;
  const glowPulse  = 0.7 + Math.sin(t.glow) * 0.3;

  // Blink state machine
  if (t.blink - lastBlinkTime > nextBlinkIn) {
    blinkPhase = 1; lastBlinkTime = t.blink;
    nextBlinkIn = 2500 + Math.random()*3500;
  }
  if (blinkPhase===1){ blinkVal = Math.min(1, blinkVal + dt*0.018); if(blinkVal>=1) blinkPhase=2; }
  else if(blinkPhase===2){ blinkPhase=3; }
  else if(blinkPhase===3){ blinkVal = Math.max(0, blinkVal - dt*0.016); if(blinkVal<=0){ blinkVal=0; blinkPhase=0; } }

  const cx = 200 + weightX;
  const torsoTop = 290 - breath;
  const torsoBot = 400;
  const hipY     = torsoBot + 5;
  const wt       = Math.sin(t.weight);

  // ── Particles ─────────────────────────────────────────────────────────────────
  for(const p of particles){
    p.x += p.vx; p.y += p.vy;
    if(p.x<0||p.x>400) p.vx=-p.vx;
    if(p.y<0||p.y>600) p.vy=-p.vy;
    p.life = (p.life + 0.005) % 1;
    const a = Math.sin(p.life * Math.PI) * 0.45;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fillStyle=`hsla(${p.hue},100%,70%,${a})`; ctx.fill();
  }

  // ── Torso ─────────────────────────────────────────────────────────────────────
  ctx.beginPath();
  ctx.ellipse(cx, (torsoTop+torsoBot)/2, 38, 58, 0, 0, Math.PI*2);
  const tg = ctx.createLinearGradient(cx-38,torsoTop,cx+38,torsoBot);
  tg.addColorStop(0,"rgba(0,180,200,0.10)"); tg.addColorStop(0.5,"rgba(80,40,160,0.14)"); tg.addColorStop(1,"rgba(0,100,140,0.07)");
  ctx.fillStyle=tg; ctx.fill();
  ctx.strokeStyle=CYAN(0.3); ctx.lineWidth=1.5; ctx.stroke();

  // Spine
  ctx.beginPath();
  ctx.moveTo(cx,torsoTop);
  ctx.bezierCurveTo(cx+spineLean,(torsoTop+torsoBot)/2, cx-spineLean*0.5,(torsoTop+torsoBot)/2+30, cx,hipY);
  ctx.strokeStyle=CYAN(0.15); ctx.lineWidth=3; ctx.stroke();

  // Circuit lines
  for(let i=0;i<4;i++){
    const ly=torsoTop+20+i*30;
    ctx.beginPath(); ctx.moveTo(cx-22,ly); ctx.lineTo(cx+22,ly);
    ctx.strokeStyle=CYAN(0.07+i*0.02); ctx.lineWidth=1; ctx.stroke();
  }

  // Chest core gem
  glow(cx,(torsoTop+torsoBot)/2, 7*glowPulse, CYAN(0.5*glowPulse), 22);
  circle(cx,(torsoTop+torsoBot)/2, 5, CYAN(0.9));

  // ── Shoulders ─────────────────────────────────────────────────────────────────
  const shY = torsoTop + 18 + breath*0.3;
  const shLX = cx-45, shRX = cx+45;
  line(shLX,shY,shRX,shY,3,CYAN(0.35));

  // ── LEFT ARM ──────────────────────────────────────────────────────────────────
  const lElbX = shLX - 22 + Math.sin(t.breath*0.7)*6;
  const lElbY = shY + 65;
  const lWrX  = lElbX - 8 + Math.sin(t.finger*0.5)*4;
  const lWrY  = lElbY + 55;
  line(shLX,shY,lElbX,lElbY,7,CYAN(0.35));
  circle(lElbX,lElbY,5,SKIN(),CYAN(0.4),1.5);
  line(lElbX,lElbY,lWrX,lWrY,5.5,CYAN(0.3));
  circle(lWrX,lWrY,4,SKIN(),CYAN(0.35),1.2);
  glow(lWrX,lWrY+8,5,CYAN(0.4*glowPulse),12);
  // Left fingers — 5, spread
  const lFA = [-1.70,-1.40,-1.10,-0.80,-0.45];
  for(let i=0;i<5;i++) drawFinger(lWrX,lWrY+6, lFA[i], fingerCurl*(0.5+i*0.12)*(i===4?0.6:1), 1);

  // ── RIGHT ARM ─────────────────────────────────────────────────────────────────
  const rElbX = shRX + 22 - Math.sin(t.breath*0.7)*6;
  const rElbY = shY + 65;
  const rWrX  = rElbX + 8 - Math.sin(t.finger*0.5)*4;
  const rWrY  = rElbY + 55;
  line(shRX,shY,rElbX,rElbY,7,CYAN(0.35));
  circle(rElbX,rElbY,5,SKIN(),CYAN(0.4),1.5);
  line(rElbX,rElbY,rWrX,rWrY,5.5,CYAN(0.3));
  circle(rWrX,rWrY,4,SKIN(),CYAN(0.35),1.2);
  glow(rWrX,rWrY+8,5,CYAN(0.4*glowPulse),12);
  // Right fingers
  const rFA = [-1.45,-1.70,-1.95,-2.25,-2.65];
  for(let i=0;i<5;i++) drawFinger(rWrX,rWrY+6, rFA[i], fingerCurl*(0.5+i*0.12)*(i===4?0.6:1), -1);

  // ── Hips ──────────────────────────────────────────────────────────────────────
  const hipLX=cx-28, hipRX=cx+28;
  line(hipLX,hipY,hipRX,hipY,4,CYAN(0.3));

  // ── LEFT LEG ──────────────────────────────────────────────────────────────────
  const lKnX=hipLX-5+wt*3,  lKnY=hipY+70;
  const lAnX=lKnX+2,         lAnY=lKnY+65+wt*4;
  line(hipLX,hipY,lKnX,lKnY,9,CYAN(0.35));
  circle(lKnX,lKnY,6,SKIN(),CYAN(0.4),1.5);
  line(lKnX,lKnY,lAnX,lAnY,7.5,CYAN(0.3));
  circle(lAnX,lAnY,5,SKIN(),CYAN(0.35),1.2);
  // Foot
  const lHL=wt<0?Math.abs(wt)*8:0;
  const lFtX=lAnX-22, lFtY=lAnY+14-lHL;
  line(lAnX,lAnY,lAnX+4,lAnY+14,5,CYAN(0.3));
  line(lAnX+4,lAnY+14,lFtX,lFtY,4,CYAN(0.3));
  // Left toes
  const ltA=[-2.80,-2.95,-3.10,-3.25,-3.40];
  for(let i=0;i<5;i++) drawToe(lFtX+i*5, lFtY, ltA[i], toeCurl*(0.4+i*0.1));

  // ── RIGHT LEG ─────────────────────────────────────────────────────────────────
  const rKnX=hipRX+5-wt*3,  rKnY=hipY+70;
  const rAnX=rKnX-2,         rAnY=rKnY+65-wt*4;
  line(hipRX,hipY,rKnX,rKnY,9,CYAN(0.35));
  circle(rKnX,rKnY,6,SKIN(),CYAN(0.4),1.5);
  line(rKnX,rKnY,rAnX,rAnY,7.5,CYAN(0.3));
  circle(rAnX,rAnY,5,SKIN(),CYAN(0.35),1.2);
  // Foot
  const rHL=wt>0?Math.abs(wt)*8:0;
  const rFtX=rAnX+22, rFtY=rAnY+14-rHL;
  line(rAnX,rAnY,rAnX-4,rAnY+14,5,CYAN(0.3));
  line(rAnX-4,rAnY+14,rFtX,rFtY,4,CYAN(0.3));
  // Right toes
  const rtA=[-0.30,-0.17,-0.04,0.10,0.24];
  for(let i=0;i<5;i++) drawToe(rFtX-i*5, rFtY, rtA[i], toeCurl*(0.4+i*0.1));

  // ── Neck ──────────────────────────────────────────────────────────────────────
  const neckX=cx+spineLean*0.6, neckY=torsoTop;
  line(neckX,neckY,neckX+headSway*0.3,neckY-22,7,CYAN(0.3));

  // ── Head ──────────────────────────────────────────────────────────────────────
  const hx=neckX+headSway, hy=neckY-22+headNod;
  const hs=34;
  ctx.save();
  ctx.beginPath();
  for(let i=0;i<8;i++){
    const a=(i/8)*Math.PI*2-Math.PI/8;
    const px=hx+Math.cos(a)*hs, py=hy+Math.sin(a)*hs*1.15;
    i===0?ctx.moveTo(px,py):ctx.lineTo(px,py);
  }
  ctx.closePath();
  const hg=ctx.createRadialGradient(hx,hy,2,hx,hy,hs);
  hg.addColorStop(0,"rgba(15,28,52,0.96)"); hg.addColorStop(1,"rgba(0,12,28,0.99)");
  ctx.fillStyle=hg; ctx.fill();
  ctx.strokeStyle=CYAN(0.45); ctx.lineWidth=1.8; ctx.stroke();
  ctx.restore();

  // Forehead rune
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(hx,hy-hs*0.72); ctx.lineTo(hx-8,hy-hs*0.45); ctx.lineTo(hx+8,hy-hs*0.45);
  ctx.closePath();
  ctx.strokeStyle=CYAN(0.4+glowPulse*0.2); ctx.lineWidth=1.2; ctx.stroke();
  ctx.restore();

  // ── Ears ──────────────────────────────────────────────────────────────────────
  const earPulse=Math.sin(t.ear)*1.5;
  ctx.beginPath(); ctx.ellipse(hx-hs+2,hy+4,5+earPulse*0.3,9,-0.2,0,Math.PI*2);
  ctx.strokeStyle=CYAN(0.35); ctx.lineWidth=1.5; ctx.stroke();
  ctx.beginPath(); ctx.ellipse(hx+hs-2,hy+4,5+earPulse*0.3,9,0.2,0,Math.PI*2);
  ctx.strokeStyle=CYAN(0.35); ctx.lineWidth=1.5; ctx.stroke();

  // ── Eyes ──────────────────────────────────────────────────────────────────────
  const eyeY=hy-4;
  for(const ex of [hx-12, hx+12]){
    circle(ex,eyeY,9,"rgba(0,0,0,0.7)",CYAN(0.3),1.2);
    glow(ex,eyeY,5*glowPulse,CYAN(0.6*glowPulse),14);
    circle(ex,eyeY,5.5,CYAN(0.85));
    // Vertical slit pupil
    ctx.save();
    ctx.beginPath();
    ctx.ellipse(ex,eyeY,1.8,3.5,0,0,Math.PI*2);
    ctx.fillStyle="rgba(0,0,0,0.95)"; ctx.fill();
    ctx.restore();
    // Iris drift
    const iDX=Math.sin(t.iris)*1.5, iDY=Math.cos(t.iris*0.7)*1;
    circle(ex+iDX,eyeY+iDY,1.2,"rgba(255,255,255,0.25)");
    // Blink lid
    if(blinkVal>0){
      ctx.save();
      ctx.beginPath();
      ctx.ellipse(ex,eyeY-9*(1-blinkVal),9,9*blinkVal,0,Math.PI,0);
      ctx.fillStyle="rgba(10,20,35,0.97)"; ctx.fill();
      ctx.restore();
    }
  }

  // ── Jaw & Mouth ───────────────────────────────────────────────────────────────
  const mTopY=hy+16, mBotY=hy+16+jawOpen;
  // Upper lip
  ctx.beginPath();
  ctx.moveTo(hx-12,mTopY);
  ctx.bezierCurveTo(hx-6,mTopY-3,hx+6,mTopY-3,hx+12,mTopY);
  ctx.strokeStyle=CYAN(0.5); ctx.lineWidth=1.5; ctx.stroke();
  // Lower lip
  ctx.beginPath();
  ctx.moveTo(hx-12,mBotY);
  ctx.bezierCurveTo(hx-6,mBotY+3,hx+6,mBotY+3,hx+12,mBotY);
  ctx.strokeStyle=CYAN(0.4); ctx.lineWidth=1.5; ctx.stroke();
  // Interior when open
  if(jawOpen>2){
    ctx.save();
    ctx.beginPath();
    ctx.ellipse(hx,(mTopY+mBotY)/2,10,jawOpen/2,0,0,Math.PI*2);
    ctx.fillStyle="rgba(70,0,35,0.65)"; ctx.fill();
    // Top teeth
    for(let i=0;i<4;i++){
      ctx.fillStyle="rgba(200,235,245,0.88)";
      ctx.fillRect(hx-7.5+i*5,mTopY+1,4,4);
    }
    // Bottom teeth
    for(let i=0;i<4;i++){
      ctx.fillStyle="rgba(175,215,228,0.72)";
      ctx.fillRect(hx-7.5+i*5,mBotY-5,4,4);
    }
    // Tongue
    ctx.beginPath();
    ctx.ellipse(hx,mBotY-4,7,4,0,0,Math.PI*2);
    ctx.fillStyle="rgba(210,35,95,0.72)"; ctx.fill();
    ctx.restore();
  }
  // Lip corner micro-twitch
  const lt=Math.sin(t.jaw*0.4)*1.5;
  circle(hx-12,mTopY+lt,1.5,CYAN(0.35));
  circle(hx+12,mTopY-lt,1.5,CYAN(0.35));

  // ── Aura ──────────────────────────────────────────────────────────────────────
  ctx.save();
  const au=ctx.createRadialGradient(cx,310,40,cx,310,220);
  au.addColorStop(0,"rgba(0,0,0,0)");
  au.addColorStop(0.7,"rgba(0,0,0,0)");
  au.addColorStop(1,`rgba(0,180,200,${0.04+glowPulse*0.03})`);
  ctx.fillStyle=au; ctx.fillRect(0,0,400,600);
  ctx.restore();
}

// ── Animation loop ────────────────────────────────────────────────────────────
let last=0;
(function loop(now){ draw(now-last); last=now; requestAnimationFrame(loop); })(0);
</script>
</body>
</html>
