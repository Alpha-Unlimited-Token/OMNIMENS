<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GODFLESH: Conscious Manifestation</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      overflow: hidden;
      background: radial-gradient(circle at center, #0e0f2b, #010308);
    }
    canvas { display: block; }
    #label {
      position: fixed;
      bottom: 36px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Courier New', monospace;
      font-size: 10px;
      letter-spacing: 0.55em;
      color: rgba(200, 170, 255, 0.35);
      text-transform: uppercase;
      pointer-events: none;
      user-select: none;
    }
  </style>
</head>
<body>

<div id="label">GODFLESH &nbsp;·&nbsp; CONSCIOUS MANIFESTATION</div>

<script>
  // ── SCENE ─────────────────────────────────────────────────────────────────────
  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x010308, 0.032);

  const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, 4, 20);

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.4;
  document.body.appendChild(renderer.domElement);

  // ── LIGHTING ──────────────────────────────────────────────────────────────────
  const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
  scene.add(ambientLight);

  const pointLight = new THREE.PointLight(0xffb3ff, 1.5, 80);
  pointLight.position.set(4, 4, 4);
  scene.add(pointLight);

  const blueLight = new THREE.PointLight(0x4488ff, 1.0, 60);
  blueLight.position.set(-6, -2, 6);
  scene.add(blueLight);

  const goldLight = new THREE.PointLight(0xffcc66, 0.7, 40);
  goldLight.position.set(0, 8, -4);
  scene.add(goldLight);

  // ── CENTRAL CORE: PULSATING RADIANT SPHERE ────────────────────────────────────
  const coreGeometry = new THREE.SphereGeometry(2, 64, 64);
  const coreMaterial = new THREE.ShaderMaterial({
    uniforms: {
      time: { value: 0 },
    },
    vertexShader: `
      uniform float time;
      varying vec3 vNormal;
      varying vec3 vPosition;
      void main() {
        vNormal = normal;
        vPosition = position + normal * sin(time + length(position)) * 0.2;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(vPosition, 1.0);
      }
    `,
    fragmentShader: `
      uniform float time;
      varying vec3 vNormal;
      varying vec3 vPosition;
      void main() {
        float pulse = sin(length(vPosition) * 5.0 + time) * 0.5 + 0.5;
        vec3 color = mix(vec3(0.9, 0.2, 1.0), vec3(0.2, 0.6, 1.0), pulse);
        float fresnel = pow(1.0 - dot(normalize(vNormal), vec3(0.0, 0.0, 1.0)), 3.0);
        color = mix(color, vec3(1.0, 1.0, 1.0), fresnel * 0.5);
        gl_FragColor = vec4(color, 1.0);
      }
    `,
  });
  const core = new THREE.Mesh(coreGeometry, coreMaterial);
  scene.add(core);

  // Inner glow halo
  const haloMesh = new THREE.Mesh(
    new THREE.SphereGeometry(2.6, 32, 32),
    new THREE.MeshBasicMaterial({ color: 0x9922ff, transparent: true, opacity: 0.07, side: THREE.BackSide })
  );
  scene.add(haloMesh);

  // ── CONCENTRIC RINGS: FLOWING LUMINOUS ENERGY WAVES ───────────────────────────
  const ringsGroup = new THREE.Group();
  for (let i = 1; i <= 6; i++) {
    const ringGeometry = new THREE.TorusGeometry(i * 1.5, 0.08, 16, 100);
    const ringMaterial = new THREE.MeshStandardMaterial({
      color: new THREE.Color(`hsl(${i * 60}, 70%, 50%)`),
      emissive: new THREE.Color(`hsl(${i * 60}, 90%, 60%)`),
      emissiveIntensity: 0.8,
      transparent: true,
      opacity: 0.5,
    });
    const ring = new THREE.Mesh(ringGeometry, ringMaterial);
    ring.rotation.x = Math.PI / 2;
    ringsGroup.add(ring);

    gsap.to(ring.rotation, {
      z: Math.PI * 2,
      duration: 10 - i,
      repeat: -1,
      ease: "none",
    });

    gsap.to(ringMaterial, {
      opacity: 0.8,
      duration: 1.5 + i * 0.4,
      repeat: -1,
      yoyo: true,
      ease: "sine.inOut",
    });
  }
  scene.add(ringsGroup);

  // ── PLASMA THREADS ────────────────────────────────────────────────────────────
  const threadGroup = new THREE.Group();
  for (let i = 0; i < 40; i++) {
    const pts = new THREE.CatmullRomCurve3([
      new THREE.Vector3(0, 0, 0),
      new THREE.Vector3(Math.random() * 4 - 2, Math.random() * 4 - 2, Math.random() * 4 - 2),
      new THREE.Vector3(Math.random() * 8 - 4, Math.random() * 8 - 4, Math.random() * 8 - 4),
    ]).getPoints(50);

    const thread = new THREE.Line(
      new THREE.BufferGeometry().setFromPoints(pts),
      new THREE.LineBasicMaterial({
        color: new THREE.Color(`hsl(${Math.random() * 360}, 80%, 65%)`),
        transparent: true,
        opacity: 0.6 + Math.random() * 0.4,
      })
    );
    threadGroup.add(thread);

    gsap.to(thread.position, {
      x: Math.random() * 2 - 1,
      y: Math.random() * 2 - 1,
      z: Math.random() * 2 - 1,
      duration: 4 + Math.random() * 3,
      repeat: -1,
      yoyo: true,
      ease: "sine.inOut",
    });

    gsap.to(thread.rotation, {
      x: Math.random() * Math.PI * 0.5,
      y: Math.random() * Math.PI * 0.5,
      duration: 5 + Math.random() * 5,
      repeat: -1,
      yoyo: true,
      ease: "sine.inOut",
    });
  }
  scene.add(threadGroup);

  // ── FRACTAL SHARDS: FLOATING COSMIC FRAGMENTS ─────────────────────────────────
  const shardGroup = new THREE.Group();
  for (let i = 0; i < 60; i++) {
    const shardGeom = Math.random() > 0.5
      ? new THREE.TetrahedronGeometry(Math.random() * 0.5 + 0.15, 0)
      : new THREE.OctahedronGeometry(Math.random() * 0.4 + 0.1, 0);

    const h = Math.random() * 360;
    const shardMat = new THREE.MeshStandardMaterial({
      color: new THREE.Color(`hsl(${h}, 80%, 60%)`),
      emissive: new THREE.Color(`hsl(${h}, 90%, 40%)`),
      emissiveIntensity: 0.7,
      metalness: 0.9,
      roughness: 0.1,
      transparent: true,
      opacity: 0.75 + Math.random() * 0.25,
    });

    const shard = new THREE.Mesh(shardGeom, shardMat);

    const radius = 4 + Math.random() * 10;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    shard.position.set(
      radius * Math.sin(phi) * Math.cos(theta),
      radius * Math.sin(phi) * Math.sin(theta),
      radius * Math.cos(phi)
    );
    shard.rotation.set(
      Math.random() * Math.PI * 2,
      Math.random() * Math.PI * 2,
      Math.random() * Math.PI * 2
    );

    shardGroup.add(shard);

    gsap.to(shard.position, {
      x: shard.position.x + (Math.random() * 2 - 1),
      y: shard.position.y + (Math.random() * 2 - 1),
      z: shard.position.z + (Math.random() * 2 - 1),
      duration: 3 + Math.random() * 5,
      repeat: -1,
      yoyo: true,
      ease: "sine.inOut",
    });

    gsap.to(shard.rotation, {
      x: shard.rotation.x + Math.PI,
      y: shard.rotation.y + Math.PI,
      duration: 4 + Math.random() * 6,
      repeat: -1,
      yoyo: true,
      ease: "none",
    });
  }
  scene.add(shardGroup);

  // ── PARTICLE FIELD ────────────────────────────────────────────────────────────
  const particleCount = 2500;
  const pPositions = new Float32Array(particleCount * 3);
  const pColors = new Float32Array(particleCount * 3);
  for (let i = 0; i < particleCount; i++) {
    const r = 8 + Math.random() * 20;
    const t = Math.random() * Math.PI * 2;
    const p = Math.acos(2 * Math.random() - 1);
    pPositions[i * 3]     = r * Math.sin(p) * Math.cos(t);
    pPositions[i * 3 + 1] = r * Math.sin(p) * Math.sin(t);
    pPositions[i * 3 + 2] = r * Math.cos(p);
    const c = new THREE.Color();
    c.setHSL(0.6 + Math.random() * 0.3, 0.85, 0.55 + Math.random() * 0.35);
    pColors[i * 3]     = c.r;
    pColors[i * 3 + 1] = c.g;
    pColors[i * 3 + 2] = c.b;
  }
  const pGeo = new THREE.BufferGeometry();
  pGeo.setAttribute("position", new THREE.BufferAttribute(pPositions, 3));
  pGeo.setAttribute("color",    new THREE.BufferAttribute(pColors, 3));
  const particles = new THREE.Points(pGeo, new THREE.PointsMaterial({
    size: 0.07, vertexColors: true, transparent: true, opacity: 0.65, sizeAttenuation: true,
  }));
  scene.add(particles);

  // ── OUTER WIREFRAME SHELLS ────────────────────────────────────────────────────
  const shell1 = new THREE.Mesh(
    new THREE.IcosahedronGeometry(6.5, 1),
    new THREE.MeshBasicMaterial({ color: 0x8855ff, wireframe: true, transparent: true, opacity: 0.06 })
  );
  scene.add(shell1);

  const shell2 = new THREE.Mesh(
    new THREE.DodecahedronGeometry(9, 0),
    new THREE.MeshBasicMaterial({ color: 0x44bbff, wireframe: true, transparent: true, opacity: 0.04 })
  );
  scene.add(shell2);

  // ── MOUSE PARALLAX ────────────────────────────────────────────────────────────
  let mouseX = 0, mouseY = 0;
  document.addEventListener("mousemove", (e) => {
    mouseX = (e.clientX / window.innerWidth  - 0.5) * 2;
    mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
  });

  // ── RESIZE ────────────────────────────────────────────────────────────────────
  window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // ── ANIMATION LOOP ────────────────────────────────────────────────────────────
  const clock = new THREE.Clock();

  function animate() {
    requestAnimationFrame(animate);
    const t = clock.getElapsedTime();

    coreMaterial.uniforms.time.value = t;

    core.rotation.y = t * 0.15;
    core.rotation.z = t * 0.08;

    ringsGroup.rotation.x = Math.sin(t * 0.12) * 0.4;
    ringsGroup.rotation.y = t * 0.05;

    threadGroup.rotation.y = t * 0.04;
    threadGroup.rotation.x = Math.sin(t * 0.07) * 0.2;

    shardGroup.rotation.y = -t * 0.025;
    shardGroup.rotation.z =  t * 0.018;

    particles.rotation.y = t * 0.008;
    particles.rotation.x = t * 0.004;

    shell1.rotation.y =  t * 0.035;
    shell1.rotation.x = -t * 0.02;
    shell2.rotation.y = -t * 0.028;
    shell2.rotation.z =  t * 0.015;

    pointLight.position.x = Math.sin(t * 0.45) * 6;
    pointLight.position.z = Math.cos(t * 0.45) * 6;
    blueLight.position.x  = Math.cos(t * 0.35) * 5;
    blueLight.position.y  = Math.sin(t * 0.28) * 4;

    camera.position.x += (mouseX * 3 - camera.position.x) * 0.025;
    camera.position.y += (-mouseY * 2 + 4 - camera.position.y) * 0.025;
    camera.lookAt(0, 0, 0);

    renderer.render(scene, camera);
  }

  animate();
</script>
</body>
</html>
