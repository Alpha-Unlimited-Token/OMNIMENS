<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GODFLESH: Metadimensional Manifestation</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      overflow: hidden;
      background: radial-gradient(circle at center, #0c0f24, #010306);
    }
    canvas { display: block; }

    #label {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Courier New', monospace;
      font-size: 11px;
      letter-spacing: 0.5em;
      color: rgba(200, 180, 255, 0.4);
      text-transform: uppercase;
      pointer-events: none;
      user-select: none;
    }
  </style>
</head>
<body>

<div id="label">GODFLESH &nbsp;·&nbsp; METADIMENSIONAL MANIFESTATION</div>

<script>
  // ── SCENE SETUP ──────────────────────────────────────────────────────────────
  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x010306, 0.04);

  const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
  camera.position.set(0, 2, 8);

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.2;
  document.body.appendChild(renderer.domElement);

  // ── LIGHTING ─────────────────────────────────────────────────────────────────
  const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
  scene.add(ambientLight);

  const pointLight = new THREE.PointLight(0xffb3ff, 1.8, 50);
  pointLight.position.set(3, 3, 5);
  scene.add(pointLight);

  const blueLight = new THREE.PointLight(0x6699ff, 1.2, 30);
  blueLight.position.set(-4, -2, 3);
  scene.add(blueLight);

  const goldLight = new THREE.PointLight(0xffdd88, 0.8, 20);
  goldLight.position.set(0, 5, -2);
  scene.add(goldLight);

  // ── NUCLEUS: CORE ENTITY ──────────────────────────────────────────────────────
  const coreGeometry = new THREE.IcosahedronGeometry(1.5, 6);
  const coreMaterial = new THREE.ShaderMaterial({
    uniforms: {
      time: { value: 0 }
    },
    vertexShader: `
      uniform float time;
      varying vec3 vNormal;
      varying vec3 vPosition;
      void main() {
        vNormal = normal;
        vPosition = position + normal * sin(time + length(position)) * 0.2;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(vPosition, 1.0);
      }
    `,
    fragmentShader: `
      uniform float time;
      varying vec3 vNormal;
      varying vec3 vPosition;
      void main() {
        float pulse = sin(length(vPosition) * 5.0 + time) * 0.8 + 0.2;
        vec3 color = mix(vec3(0.2, 0.4, 1.0), vec3(1.0, 0.5, 0.9), pulse);
        float fresnel = pow(1.0 - dot(normalize(vNormal), vec3(0.0, 0.0, 1.0)), 2.5);
        color = mix(color, vec3(1.0, 0.9, 1.0), fresnel * 0.6);
        gl_FragColor = vec4(color, 1.0);
      }
    `,
  });
  const core = new THREE.Mesh(coreGeometry, coreMaterial);
  scene.add(core);

  // Inner glow orb
  const glowGeometry = new THREE.SphereGeometry(1.8, 32, 32);
  const glowMaterial = new THREE.MeshBasicMaterial({
    color: 0x8844ff,
    transparent: true,
    opacity: 0.08,
    side: THREE.BackSide,
  });
  scene.add(new THREE.Mesh(glowGeometry, glowMaterial));

  // ── MULTIDIMENSIONAL THREADS ──────────────────────────────────────────────────
  const outerGroup = new THREE.Group();
  for (let i = 0; i < 80; i++) {
    const threadGeometry = new THREE.TubeGeometry(
      new THREE.CatmullRomCurve3([
        new THREE.Vector3(0, 0, 0),
        new THREE.Vector3(Math.random() * 4 - 2, Math.random() * 4 - 2, Math.random() * 4 - 2),
        new THREE.Vector3(Math.random() * 8 - 4, Math.random() * 8 - 4, Math.random() * 8 - 4)
      ]), 20, 0.05, 8, false
    );

    const h = Math.random() * 360;
    const threadMaterial = new THREE.MeshStandardMaterial({
      color: new THREE.Color(`hsl(${h}, 80%, 70%)`),
      emissive: new THREE.Color(`hsl(${h}, 90%, 50%)`),
      emissiveIntensity: 0.6,
      metalness: 0.8,
      roughness: 0.3,
      transparent: true,
      opacity: 0.7 + Math.random() * 0.3,
    });

    const thread = new THREE.Mesh(threadGeometry, threadMaterial);
    outerGroup.add(thread);

    gsap.to(thread.position, {
      y: Math.random() * 2 - 1,
      z: Math.random() * 2 - 1,
      x: Math.random() * 2 - 1,
      duration: 4 + Math.random() * 4,
      repeat: -1,
      yoyo: true,
      ease: "sine.inOut",
    });

    gsap.to(thread.rotation, {
      x: Math.random() * Math.PI,
      y: Math.random() * Math.PI,
      duration: 6 + Math.random() * 6,
      repeat: -1,
      yoyo: true,
      ease: "sine.inOut",
    });
  }
  scene.add(outerGroup);

  // ── DYNAMIC LUMINESCENCE RINGS ────────────────────────────────────────────────
  const ringsGroup = new THREE.Group();
  for (let i = 0; i < 5; i++) {
    const ringGeometry = new THREE.RingGeometry(2 + i * 0.5, 2 + i * 0.6, 128);
    const ringMaterial = new THREE.MeshBasicMaterial({
      color: new THREE.Color(`hsl(${120 + i * 30}, 70%, 60%)`),
      transparent: true,
      opacity: 0.15 + i * 0.08,
      side: THREE.DoubleSide,
    });
    const ring = new THREE.Mesh(ringGeometry, ringMaterial);
    ring.rotation.x = Math.PI / 3 + i * 0.3;
    ring.rotation.y = i * 0.5;
    scene.add(ring);

    gsap.to(ring.rotation, {
      z: Math.PI * 2,
      duration: 10 - i * 1.2,
      repeat: -1,
      ease: "none",
    });

    gsap.to(ringMaterial, {
      opacity: 0.3 + i * 0.06,
      duration: 2 + i * 0.5,
      repeat: -1,
      yoyo: true,
      ease: "sine.inOut",
    });
  }
  scene.add(ringsGroup);

  // ── PARTICLE FIELD ────────────────────────────────────────────────────────────
  const particleCount = 2000;
  const positions = new Float32Array(particleCount * 3);
  const colors = new Float32Array(particleCount * 3);

  for (let i = 0; i < particleCount; i++) {
    const r = 5 + Math.random() * 15;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    positions[i * 3]     = r * Math.sin(phi) * Math.cos(theta);
    positions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
    positions[i * 3 + 2] = r * Math.cos(phi);

    const h = Math.random();
    const c = new THREE.Color();
    c.setHSL(0.65 + h * 0.25, 0.8, 0.6 + Math.random() * 0.4);
    colors[i * 3]     = c.r;
    colors[i * 3 + 1] = c.g;
    colors[i * 3 + 2] = c.b;
  }

  const particleGeometry = new THREE.BufferGeometry();
  particleGeometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));
  particleGeometry.setAttribute("color", new THREE.BufferAttribute(colors, 3));

  const particleMaterial = new THREE.PointsMaterial({
    size: 0.06,
    vertexColors: true,
    transparent: true,
    opacity: 0.7,
    sizeAttenuation: true,
  });

  const particles = new THREE.Points(particleGeometry, particleMaterial);
  scene.add(particles);

  // ── SACRED GEOMETRY OUTER SHELL ───────────────────────────────────────────────
  const dodecaGeometry = new THREE.DodecahedronGeometry(3.5, 0);
  const dodecaMaterial = new THREE.MeshBasicMaterial({
    color: 0x9966ff,
    wireframe: true,
    transparent: true,
    opacity: 0.08,
  });
  const dodecahedron = new THREE.Mesh(dodecaGeometry, dodecaMaterial);
  scene.add(dodecahedron);

  const icosaGeometry = new THREE.IcosahedronGeometry(4.5, 0);
  const icosaMaterial = new THREE.MeshBasicMaterial({
    color: 0x44aaff,
    wireframe: true,
    transparent: true,
    opacity: 0.05,
  });
  const icosahedron = new THREE.Mesh(icosaGeometry, icosaMaterial);
  scene.add(icosahedron);

  // ── MOUSE PARALLAX ────────────────────────────────────────────────────────────
  let mouseX = 0, mouseY = 0;
  document.addEventListener("mousemove", (e) => {
    mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
    mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
  });

  // ── RESIZE ────────────────────────────────────────────────────────────────────
  window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // ── ANIMATION LOOP ────────────────────────────────────────────────────────────
  const clock = new THREE.Clock();

  function animate() {
    requestAnimationFrame(animate);

    const t = clock.getElapsedTime();

    // Update shader time
    coreMaterial.uniforms.time.value = t;

    // Core breathing rotation
    core.rotation.x = t * 0.18;
    core.rotation.y = t * 0.23;
    core.rotation.z = t * 0.11;

    // Outer group slow rotation
    outerGroup.rotation.y = t * 0.06;
    outerGroup.rotation.x = Math.sin(t * 0.07) * 0.3;

    // Sacred geometry counter-rotation
    dodecahedron.rotation.y = -t * 0.04;
    dodecahedron.rotation.x = t * 0.03;
    icosahedron.rotation.y  =  t * 0.03;
    icosahedron.rotation.z  = -t * 0.025;

    // Particle field gentle drift
    particles.rotation.y = t * 0.01;
    particles.rotation.x = t * 0.005;

    // Point light orbit
    pointLight.position.x = Math.sin(t * 0.5) * 5;
    pointLight.position.z = Math.cos(t * 0.5) * 5;
    blueLight.position.x  = Math.cos(t * 0.4) * 4;
    blueLight.position.y  = Math.sin(t * 0.3) * 3;

    // Mouse parallax camera
    camera.position.x += (mouseX * 2 - camera.position.x) * 0.02;
    camera.position.y += (-mouseY * 1.5 - camera.position.y + 2) * 0.02;
    camera.lookAt(0, 0, 0);

    renderer.render(scene, camera);
  }

  animate();
</script>
</body>
</html>
