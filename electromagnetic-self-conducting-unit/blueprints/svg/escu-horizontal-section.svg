<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <style>
      .border { fill: none; stroke: #000; stroke-width: 2; }
      .thick { fill: none; stroke: #000; stroke-width: 1.5; }
      .thin { fill: none; stroke: #000; stroke-width: 0.5; }
      .center { fill: none; stroke: #000; stroke-width: 0.3; stroke-dasharray: 12,3,3,3; }
      .dim { fill: none; stroke: #000; stroke-width: 0.4; }
      .dimtext { font-family: Arial, sans-serif; font-size: 10px; text-anchor: middle; }
      .label { font-family: Arial, sans-serif; font-size: 8px; }
      .title { font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; text-anchor: middle; }
      .subtitle { font-family: Arial, sans-serif; font-size: 10px; text-anchor: middle; }
      .tb { font-family: Arial, sans-serif; font-size: 9px; }
      .tbh { font-family: Arial, sans-serif; font-size: 7px; fill: #666; }
      .arrow { fill: #000; }
    </style>
    <marker id="aS" markerWidth="6" markerHeight="4" refX="6" refY="2" orient="auto">
      <polygon points="0,0 6,2 0,4" class="arrow"/>
    </marker>
    <marker id="aE" markerWidth="6" markerHeight="4" refX="0" refY="2" orient="auto">
      <polygon points="6,0 0,2 6,4" class="arrow"/>
    </marker>
  </defs>

  <!-- Border -->
  <rect x="10" y="10" width="1180" height="880" class="border"/>
  <rect x="20" y="20" width="1160" height="790" class="border" stroke-width="1"/>

  <!-- Title Block -->
  <rect x="750" y="815" width="440" height="70" class="border"/>
  <line x1="750" y1="835" x2="1190" y2="835" class="thick"/>
  <line x1="750" y1="855" x2="1190" y2="855" class="thick"/>
  <line x1="900" y1="815" x2="900" y2="885" class="thick"/>
  <line x1="1050" y1="815" x2="1050" y2="885" class="thick"/>
  <text x="825" y="828" class="tbh">DRAWN BY</text>
  <text x="825" y="848" class="tb">OMNIMENS ADI</text>
  <text x="975" y="828" class="tbh">DATE</text>
  <text x="975" y="848" class="tb">2026-03-28</text>
  <text x="1120" y="828" class="tbh">SCALE</text>
  <text x="1120" y="848" class="tb">3:1</text>
  <text x="825" y="868" class="tbh">APPROVED</text>
  <text x="825" y="882" class="tb">G. KOWALSKI</text>
  <text x="975" y="868" class="tbh">DWG NO.</text>
  <text x="975" y="882" class="tb">ESCU-003-A</text>
  <text x="1120" y="868" class="tbh">REV</text>
  <text x="1120" y="882" class="tb">A</text>
  <text x="400" y="840" class="title">ELECTROMAGNETIC SELF-CONDUCTING UNIT (ESCU)</text>
  <text x="400" y="858" class="subtitle">SECTION B-B — HORIZONTAL CUT THROUGH LAYER 3</text>
  <text x="400" y="875" class="subtitle" font-size="8">(C) 2024-2026 Alpha Unlimited Technologies, LLC. All Rights Reserved.</text>

  <text x="400" y="50" class="title">SECTION B-B — TOP VIEW (CUT THROUGH LAYER 3)</text>

  <!-- Main circle center at (400, 400) -->
  <!-- Centerlines -->
  <line x1="400" y1="100" x2="400" y2="700" class="center"/>
  <line x1="100" y1="400" x2="700" y2="400" class="center"/>

  <!-- Outer shell (Ti Gr.5) - 120mm dia = 360px at 3:1 -->
  <circle cx="400" cy="400" r="180" fill="#d8d8d8" stroke="#000" stroke-width="1.5"/>

  <!-- Cooling jacket annular ring - 10mm thick = 30px -->
  <circle cx="400" cy="400" r="180" fill="none" stroke="#000" stroke-width="1"/>
  <circle cx="400" cy="400" r="150" fill="#e8e8e8" stroke="#000" stroke-width="0.8"/>
  <!-- Cooling channels (spiral grooves shown as arcs) -->
  <path d="M 400 220 A 180 180 0 0 1 580 400" fill="none" stroke="#0088cc" stroke-width="4" opacity="0.4"/>
  <path d="M 580 400 A 180 180 0 0 1 400 580" fill="none" stroke="#0088cc" stroke-width="4" opacity="0.4"/>
  <path d="M 400 580 A 180 180 0 0 1 220 400" fill="none" stroke="#cc4400" stroke-width="4" opacity="0.4"/>
  <path d="M 220 400 A 180 180 0 0 1 400 220" fill="none" stroke="#cc4400" stroke-width="4" opacity="0.4"/>

  <!-- AMFOS coil zone ring -->
  <circle cx="400" cy="400" r="150" fill="none" stroke="#000" stroke-width="0.5"/>
  <circle cx="400" cy="400" r="135" fill="#f0f0e0" stroke="#000" stroke-width="0.5"/>

  <!-- 24 AMFOS coils (shown as small circles around ring, every 15 degrees) -->
  <circle cx="400" cy="258" r="6" fill="#cc9" stroke="#000" stroke-width="0.5"/>
  <circle cx="437" cy="259" r="6" fill="#cc9" stroke="#000" stroke-width="0.5"/>
  <circle cx="472" cy="266" r="6" fill="#cc9" stroke="#000" stroke-width="0.5"/>
  <circle cx="504" cy="279" r="6" fill="#cc9" stroke="#000" stroke-width="0.5"/>
  <circle cx="530" cy="298" r="6" fill="#cc9" stroke="#000" stroke-width="0.5"/>
  <circle cx="550" cy="322" r="6" fill="#cc9" stroke="#000" stroke-width="0.5"/>
  <circle cx="542" cy="400" r="6" fill="#cc9" stroke="#000" stroke-width="0.5"/>
  <circle cx="550" cy="363" r="6" fill="#cc9" stroke="#000" stroke-width="0.5"/>
  <circle cx="550" cy="437" r="6" fill="#cc9" stroke="#000" stroke-width="0.5"/>
  <circle cx="542" cy="470" r="6" fill="#cc9" stroke="#000" stroke-width="0.5"/>
  <circle cx="530" cy="502" r="6" fill="#cc9" stroke="#000" stroke-width="0.5"/>
  <circle cx="504" cy="521" r="6" fill="#cc9" stroke="#000" stroke-width="0.5"/>
  <circle cx="472" cy="534" r="6" fill="#cc9" stroke="#000" stroke-width="0.5"/>
  <circle cx="437" cy="541" r="6" fill="#cc9" stroke="#000" stroke-width="0.5"/>
  <circle cx="400" cy="542" r="6" fill="#cc9" stroke="#000" stroke-width="0.5"/>
  <circle cx="363" cy="541" r="6" fill="#cc9" stroke="#000" stroke-width="0.5"/>
  <circle cx="328" cy="534" r="6" fill="#cc9" stroke="#000" stroke-width="0.5"/>
  <circle cx="296" cy="521" r="6" fill="#cc9" stroke="#000" stroke-width="0.5"/>
  <circle cx="270" cy="502" r="6" fill="#cc9" stroke="#000" stroke-width="0.5"/>
  <circle cx="250" cy="478" r="6" fill="#cc9" stroke="#000" stroke-width="0.5"/>
  <circle cx="250" cy="437" r="6" fill="#cc9" stroke="#000" stroke-width="0.5"/>
  <circle cx="258" cy="400" r="6" fill="#cc9" stroke="#000" stroke-width="0.5"/>
  <circle cx="250" cy="322" r="6" fill="#cc9" stroke="#000" stroke-width="0.5"/>
  <circle cx="270" cy="298" r="6" fill="#cc9" stroke="#000" stroke-width="0.5"/>

  <!-- N52 Halbach shell ring -->
  <circle cx="400" cy="400" r="135" fill="none" stroke="#000" stroke-width="0.5"/>
  <circle cx="400" cy="400" r="123" fill="#bbc" stroke="#000" stroke-width="1"/>
  <!-- Halbach magnetization arrows (16 segments, 22.5deg each) -->
  <text x="400" y="282" class="label" text-anchor="middle" font-size="10">→</text>
  <text x="455" y="287" class="label" text-anchor="middle" font-size="10">↑</text>
  <text x="497" y="310" class="label" text-anchor="middle" font-size="10">←</text>
  <text x="520" y="348" class="label" text-anchor="middle" font-size="10">↓</text>
  <text x="523" y="400" class="label" text-anchor="middle" font-size="10">→</text>
  <text x="520" y="452" class="label" text-anchor="middle" font-size="10">↑</text>
  <text x="497" y="490" class="label" text-anchor="middle" font-size="10">←</text>
  <text x="455" y="513" class="label" text-anchor="middle" font-size="10">↓</text>
  <text x="400" y="518" class="label" text-anchor="middle" font-size="10">→</text>
  <text x="345" y="513" class="label" text-anchor="middle" font-size="10">↑</text>
  <text x="303" y="490" class="label" text-anchor="middle" font-size="10">←</text>
  <text x="280" y="452" class="label" text-anchor="middle" font-size="10">↓</text>
  <text x="277" y="400" class="label" text-anchor="middle" font-size="10">→</text>
  <text x="280" y="348" class="label" text-anchor="middle" font-size="10">↑</text>
  <text x="303" y="310" class="label" text-anchor="middle" font-size="10">←</text>
  <text x="345" y="287" class="label" text-anchor="middle" font-size="10">↓</text>

  <!-- Magnetic plate (Layer 3) - 96mm dia = 288px -->
  <circle cx="400" cy="400" r="120" fill="#d0d0e8" stroke="#000" stroke-width="1"/>

  <!-- Mercury zone (fill between plate and shell) -->
  <!-- Already visible as gap between plate circle (r=120) and shell (r=123) -->

  <!-- 8 Tungsten conductor strips (radial) -->
  <line x1="400" y1="310" x2="400" y2="280" stroke="#c0a030" stroke-width="6"/>
  <line x1="485" y1="315" x2="496" y2="290" stroke="#c0a030" stroke-width="6"/>
  <line x1="520" y1="400" x2="515" y2="400" stroke="#c0a030" stroke-width="6"/>
  <line x1="485" y1="485" x2="496" y2="510" stroke="#c0a030" stroke-width="6"/>
  <line x1="400" y1="490" x2="400" y2="520" stroke="#c0a030" stroke-width="6"/>
  <line x1="315" y1="485" x2="304" y2="510" stroke="#c0a030" stroke-width="6"/>
  <line x1="280" y1="400" x2="285" y2="400" stroke="#c0a030" stroke-width="6"/>
  <line x1="315" y1="315" x2="304" y2="290" stroke="#c0a030" stroke-width="6"/>

  <!-- Central shaft -->
  <circle cx="400" cy="400" r="23" fill="#bbb" stroke="#000" stroke-width="1.2"/>
  <text x="400" y="404" class="dimtext" font-size="7">SHAFT</text>
  <!-- Bus bars inside shaft -->
  <circle cx="393" cy="400" r="4" fill="#d4a" stroke="#000" stroke-width="0.3"/>
  <circle cx="407" cy="400" r="4" fill="#4ad" stroke="#000" stroke-width="0.3"/>

  <!-- Shaft clearance hole in plate -->
  <circle cx="400" cy="400" r="25" fill="none" stroke="#000" stroke-width="0.5" stroke-dasharray="3,2"/>

  <!-- Rotation arrow -->
  <path d="M 450 330 A 80 80 0 0 1 470 400" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#aS)"/>
  <text x="478" y="360" class="label" font-weight="bold">CW →</text>

  <!-- Collection rings -->
  <circle cx="400" cy="400" r="30" fill="none" stroke="#a06020" stroke-width="1.5" stroke-dasharray="4,2"/>
  <circle cx="400" cy="400" r="115" fill="none" stroke="#a06020" stroke-width="1.5" stroke-dasharray="4,2"/>

  <!-- DIMENSIONS -->
  <!-- Overall diameter -->
  <line x1="220" y1="620" x2="220" y2="650" class="dim"/>
  <line x1="580" y1="620" x2="580" y2="650" class="dim"/>
  <line x1="220" y1="640" x2="580" y2="640" class="dim" marker-start="url(#aE)" marker-end="url(#aS)"/>
  <text x="400" y="636" class="dimtext">120mm overall dia.</text>

  <!-- Plate diameter -->
  <line x1="280" y1="650" x2="280" y2="670" class="dim"/>
  <line x1="520" y1="650" x2="520" y2="670" class="dim"/>
  <line x1="280" y1="660" x2="520" y2="660" class="dim" marker-start="url(#aE)" marker-end="url(#aS)"/>
  <text x="400" y="656" class="dimtext">96mm plate dia.</text>

  <!-- Shaft diameter -->
  <line x1="377" y1="430" x2="377" y2="450" class="dim"/>
  <line x1="423" y1="430" x2="423" y2="450" class="dim"/>
  <line x1="377" y1="445" x2="423" y2="445" class="dim" marker-start="url(#aE)" marker-end="url(#aS)"/>
  <text x="400" y="460" class="dimtext" font-size="8">15mm shaft</text>

  <!-- CALLOUTS -->
  <line x1="485" y1="315" x2="620" y2="250" stroke="#000" stroke-width="0.3"/>
  <text x="625" y="248" class="label">TUNGSTEN STRIP (W)</text>
  <text x="625" y="258" class="label">40x3x2mm, 8 per layer</text>

  <line x1="523" y1="400" x2="640" y2="400" stroke="#000" stroke-width="0.3"/>
  <text x="645" y="398" class="label">N52 HALBACH SHELL</text>
  <text x="645" y="408" class="label">4mm thick, 16 segments</text>

  <line x1="542" y1="400" x2="640" y2="340" stroke="#000" stroke-width="0.3"/>
  <text x="645" y="338" class="label">AMFOS COIL (x24)</text>
  <text x="645" y="348" class="label">Copper, sealed housing</text>

  <line x1="400" y1="520" x2="640" y2="520" stroke="#000" stroke-width="0.3"/>
  <text x="645" y="518" class="label">MERCURY GAP (8mm)</text>
  <text x="645" y="528" class="label">Between plate and shell</text>

  <line x1="393" y1="396" x2="640" y2="470" stroke="#000" stroke-width="0.3"/>
  <text x="645" y="468" class="label">Ta BUS BAR (+)</text>
  <line x1="407" y1="396" x2="640" y2="485" stroke="#000" stroke-width="0.3"/>
  <text x="645" y="483" class="label">Ta BUS BAR (-)</text>

  <line x1="365" y1="435" x2="640" y2="560" stroke="#000" stroke-width="0.3"/>
  <text x="645" y="558" class="label">Mo COLLECTION RING (inner)</text>

  <line x1="290" y1="460" x2="640" y2="580" stroke="#000" stroke-width="0.3"/>
  <text x="645" y="578" class="label">Mo COLLECTION RING (outer)</text>

  <!-- Coolant flow arrows -->
  <text x="580" y="260" class="label" fill="#0088cc" font-weight="bold">COOL IN →</text>
  <text x="200" y="540" class="label" fill="#cc4400" font-weight="bold">← HOT OUT</text>

  <!-- NOTES -->
  <text x="30" y="760" class="label" font-size="8">NOTES:</text>
  <text x="30" y="775" class="label" font-size="7">1. SECTION CUT THROUGH LAYER 3 (MIDDLE PLATE, CW ROTATION)</text>
  <text x="30" y="787" class="label" font-size="7">2. HALBACH ARROWS SHOW MAGNETIZATION DIRECTION OF EACH SEGMENT</text>
  <text x="30" y="799" class="label" font-size="7">3. MERCURY FILLS ALL SPACE BETWEEN PLATE OD AND HALBACH ID</text>
  <text x="30" y="811" class="label" font-size="7">4. PLATE IS MAGNETICALLY LEVITATED — NO PHYSICAL BEARINGS</text>
  <text x="30" y="823" class="label" font-size="7">5. COLLECTION RINGS (Mo) CONNECT TUNGSTEN STRIPS TO BUS BARS</text>
  <text x="30" y="835" class="label" font-size="7">6. COOLANT FLOW: COUNTER-FLOW SPIRAL (BLUE=COLD IN, RED=HOT OUT)</text>
</svg>
