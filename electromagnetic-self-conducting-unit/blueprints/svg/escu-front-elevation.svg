      .thin { fill: none; stroke: #000; stroke-width: 0.5; }
      .dashed { fill: none; stroke: #000; stroke-width: 0.5; stroke-dasharray: 6,3; }
      .center { fill: none; stroke: #000; stroke-width: 0.3; stroke-dasharray: 12,3,3,3; }
      .dim { fill: none; stroke: #000; stroke-width: 0.4; }
      .dimtext { font-family: Arial, sans-serif; font-size: 10px; text-anchor: middle; }
      .label { font-family: Arial, sans-serif; font-size: 9px; text-anchor: start; }
      .title { font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; text-anchor: middle; }
      .subtitle { font-family: Arial, sans-serif; font-size: 10px; text-anchor: middle; }
      .titleblock { font-family: Arial, sans-serif; font-size: 9px; }
      .tbhead { font-family: Arial, sans-serif; font-size: 7px; fill: #666; }
      .hatch { fill: none; stroke: #000; stroke-width: 0.3; }
      .section-fill { fill: #e8e8e8; stroke: none; }
      .component { fill: #f0f0f0; stroke: #000; stroke-width: 1; }
      .magnet { fill: #ccd; stroke: #000; stroke-width: 0.8; }
      .mercury { fill: #d0dde8; stroke: #000; stroke-width: 0.3; }
      .coolant { fill: #c8e0f0; stroke: #000; stroke-width: 0.5; }
      .conductor { fill: #e0d0a0; stroke: #000; stroke-width: 0.5; }
      .titanium { fill: #d8d8d8; stroke: #000; stroke-width: 1; }
      .arrow { fill: #000; stroke: none; }
    </style>
    <marker id="arrowS" markerWidth="6" markerHeight="4" refX="6" refY="2" orient="auto">
      <polygon points="0,0 6,2 0,4" class="arrow"/>
    </marker>
    <marker id="arrowE" markerWidth="6" markerHeight="4" refX="0" refY="2" orient="auto">
      <polygon points="6,0 0,2 6,4" class="arrow"/>
    </marker>
    <pattern id="hatch45" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#999" stroke-width="0.3"/>
    </pattern>
    <pattern id="hatch135" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(135)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#999" stroke-width="0.3"/>
    </pattern>
  </defs>

  <!-- Drawing Border -->
