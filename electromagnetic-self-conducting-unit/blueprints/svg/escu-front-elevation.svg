  <text x="30" y="775" class="label" font-size="7">1. ALL DIMENSIONS IN MILLIMETERS UNLESS OTHERWISE NOTED</text>
  <text x="30" y="787" class="label" font-size="7">2. MATERIAL: OUTER SHELL — TITANIUM GRADE 5 (Ti-6Al-4V)</text>
  <text x="30" y="799" class="label" font-size="7">3. SURFACE FINISH: Ra 0.8um (MACHINED AND POLISHED)</text>
  <text x="30" y="811" class="label" font-size="7">4. TOLERANCES UNLESS NOTED: LINEAR +/- 0.1mm, ANGULAR +/- 0.5deg</text>
