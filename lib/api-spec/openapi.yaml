openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: openai
    description: OpenAI AI chat, image, and audio operations
  - name: superai
    description: Super AI multi-agent collaboration endpoints
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /openai/conversations:
    get:
      operationId: listOpenaiConversations
      tags: [openai]
      summary: List all conversations
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpenaiConversation"
    post:
      operationId: createOpenaiConversation
      tags: [openai]
      summary: Create a new conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOpenaiConversationBody"
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiConversation"
  /openai/conversations/{id}:
    get:
      operationId: getOpenaiConversation
      tags: [openai]
      summary: Get conversation with messages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Conversation with messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiConversationWithMessages"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
    delete:
      operationId: deleteOpenaiConversation
      tags: [openai]
      summary: Delete a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
  /openai/conversations/{id}/messages:
    get:
      operationId: listOpenaiMessages
      tags: [openai]
      summary: List messages in a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpenaiMessage"
    post:
      operationId: sendOpenaiMessage
      tags: [openai]
      summary: Send a text message and receive a streaming text response
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendOpenaiMessageBody"
      responses:
        "200":
          description: SSE stream of assistant text chunks
          content:
            text/event-stream: {}
  /superai/sessions:
    get:
      operationId: listSuperAISessions
      tags: [superai]
      summary: List all Super AI collaboration sessions
      responses:
        "200":
          description: List of sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SuperAISession"
    post:
      operationId: createSuperAISession
      tags: [superai]
      summary: Create a new Super AI session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSuperAISessionBody"
      responses:
        "201":
          description: Created session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuperAISession"
  /superai/sessions/{id}:
    get:
      operationId: getSuperAISession
      tags: [superai]
      summary: Get session with all agent messages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Session with messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuperAISessionWithMessages"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuperAIError"
    delete:
      operationId: deleteSuperAISession
      tags: [superai]
      summary: Delete a session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuperAIError"
  /superai/sessions/{id}/run:
    post:
      operationId: runSuperAISession
      tags: [superai]
      summary: Run the multi-agent collaboration and stream agent messages
      description: |
        Streams real-time SSE events as three AI agents (Architect, Critic, Synthesizer)
        discuss and develop a superior AI design. Each event carries the agent name and
        message chunk, culminating in a final blueprint document.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunSuperAISessionBody"
      responses:
        "200":
          description: SSE stream of agent messages
          content:
            text/event-stream: {}
  /superai/sessions/{id}/blueprint:
    get:
      operationId: getSuperAIBlueprint
      tags: [superai]
      summary: Get the final Super AI blueprint document for a session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Blueprint document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuperAIBlueprint"
        "404":
          description: Not found or not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuperAIError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    OpenaiConversation:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - createdAt
    OpenaiMessage:
      type: object
      properties:
        id:
          type: integer
        conversationId:
          type: integer
        role:
          type: string
        content:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - conversationId
        - role
        - content
        - createdAt
    CreateOpenaiConversationBody:
      type: object
      properties:
        title:
          type: string
      required:
        - title
    SendOpenaiMessageBody:
      type: object
      properties:
        content:
          type: string
      required:
        - content
    OpenaiConversationWithMessages:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        createdAt:
          type: string
          format: date-time
        messages:
          type: array
          items:
            $ref: "#/components/schemas/OpenaiMessage"
      required:
        - id
        - title
        - createdAt
        - messages
    OpenaiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    SuperAISession:
      type: object
      properties:
        id:
          type: integer
        topic:
          type: string
        status:
          type: string
          enum: [pending, running, completed]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - topic
        - status
        - createdAt
    SuperAISessionWithMessages:
      type: object
      properties:
        id:
          type: integer
        topic:
          type: string
        status:
          type: string
          enum: [pending, running, completed]
        createdAt:
          type: string
          format: date-time
        messages:
          type: array
          items:
            $ref: "#/components/schemas/SuperAIAgentMessage"
      required:
        - id
        - topic
        - status
        - createdAt
        - messages
    SuperAIAgentMessage:
      type: object
      properties:
        id:
          type: integer
        sessionId:
          type: integer
        agentName:
          type: string
          enum: [Architect, Critic, Synthesizer]
        content:
          type: string
        round:
          type: integer
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - sessionId
        - agentName
        - content
        - round
        - createdAt
    CreateSuperAISessionBody:
      type: object
      properties:
        topic:
          type: string
      required:
        - topic
    RunSuperAISessionBody:
      type: object
      properties:
        rounds:
          type: integer
          description: Number of discussion rounds between agents (1-5)
      required: []
    SuperAIBlueprint:
      type: object
      properties:
        sessionId:
          type: integer
        title:
          type: string
        content:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - sessionId
        - title
        - content
        - createdAt
    SuperAIError:
      type: object
      properties:
        error:
          type: string
      required:
        - error
