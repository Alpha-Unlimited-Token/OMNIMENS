[build]
builder = "NIXPACKS"
buildCommand = "npm install -g pnpm && pnpm install --frozen-lockfile && pnpm run build:railway"

[deploy]
startCommand = "node artifacts/api-server/dist/index.cjs"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

[variables]
NODE_ENV = "production"
PORT = "8080"
